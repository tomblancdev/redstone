# The robot that does the upgrades — weekly, small, boring. Exactly how
# dependency bumps should be.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /sdk/js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
