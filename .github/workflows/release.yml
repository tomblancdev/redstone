# ⚡ tag vX.Y.Z -> gate -> cross-build -> GitHub Release with binaries and
# checksums. No manual uploads, ever. (See CONTRIBUTING.md, Releases.)
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: gate
        run: go vet ./... && go test ./...
      - name: cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o bin/redstone-linux-amd64 ./cmd/redstone
          GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o bin/redstone-linux-arm64 ./cmd/redstone
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o bin/redstone-windows-amd64.exe ./cmd/redstone
          (cd bin && sha256sum redstone-* > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/redstone-*
            bin/checksums.txt
          body_path: .github/release-footer.md
          generate_release_notes: true
