# ⚡ js/ts sdk — runs ONLY when sdk/js or the proto it loads at runtime
# changes.
name: sdk-js
on:
  push:
    branches: [main]
    paths:
      - "sdk/js/**"
      - "proto/**"
      - ".github/workflows/sdk-js.yml"
  pull_request:
    paths:
      - "sdk/js/**"
      - "proto/**"
      - ".github/workflows/sdk-js.yml"

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: install + load
        working-directory: sdk/js
        run: |
          npm ci --no-audit --no-fund
          node -e "import('./index.mjs').then(m => { const c = m.createClient({register:'localhost:1', stack:'ci', app:'smoke'}); console.log('⚡ js sdk loads, bind =', typeof c.bind); c.close(); })"
      - name: types hold (tsc --strict)
        working-directory: sdk/js
        run: npx -y -p typescript@5.6 tsc --strict --noEmit --module nodenext --moduleResolution nodenext types-test.mts
