[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redstone-sdk"
version = "0.1.0"
description = "The Python binder for redstone — bind capabilities, never products. ⚡"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[tool.setuptools.packages.find]
include = ["redstone_sdk*"]

[tool.setuptools.package-data]
redstone_sdk = ["_gen/**/*.py"]
