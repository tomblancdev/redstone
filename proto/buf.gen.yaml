version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tomblancdev/redstone/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../gen
    opt: paths=source_relative
  # Python stubs land inside the py SDK package (self-contained install).
  - remote: buf.build/protocolbuffers/python
    out: ../sdk/py/redstone_sdk/_gen
  - remote: buf.build/grpc/python
    out: ../sdk/py/redstone_sdk/_gen
